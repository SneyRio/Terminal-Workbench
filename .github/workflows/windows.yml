name: Windows x64
on:
  push:
    branches: [main, codex/windows-support, codex/windows-cli-discovery]
    paths-ignore: ["docs/**", "README.md", "design-qa.md"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    outputs:
      version: ${{ steps.version.outputs.version }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - id: version
        shell: bash
        run: echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"
      - run: npm ci --ignore-scripts
      - run: node node_modules/electron/install.js
      - uses: actions/cache@v4
        id: pty-cache
        with:
          path: node_modules/node-pty/build
          key: windows-2022-x64-electron-45.2.2-nodepty-1.1.0-${{ hashFiles('package-lock.json') }}
      - run: npm run rebuild:native
        if: steps.pty-cache.outputs.cache-hit != 'true'
      - uses: actions/cache/save@v4
        if: steps.pty-cache.outputs.cache-hit != 'true'
        with:
          path: node_modules/node-pty/build
          key: windows-2022-x64-electron-45.2.2-nodepty-1.1.0-${{ hashFiles('package-lock.json') }}
      - run: node --test tests/cli-discovery.test.cjs tests/file-trash.test.cjs tests/platform.test.cjs tests/release-readiness.test.cjs tests/performance.test.cjs tests/session-history.test.cjs tests/session-titles.test.cjs
      - run: npm run package:win
      - run: ./scripts/build-windows-fixture.ps1
      - run: npm run test:windows
        timeout-minutes: 5
      - run: node scripts/release-windows.mjs
      - run: node scripts/windows-installer-smoke.mjs
        timeout-minutes: 5
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-validation
          path: test-results/windows-*
      - uses: actions/upload-artifact@v4
        with:
          name: WbSpace-windows-x64
          path: |
            release/windows/*-setup.exe
            release/windows/*-portable.zip
            release/windows/SHA256SUMS.txt
            release/windows/release-manifest.json
            release/windows/安装说明.txt
          if-no-files-found: error
  publish:
    if: github.ref == 'refs/heads/main'
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: WbSpace-windows-x64
          path: bundle
      - uses: actions/download-artifact@v4
        with:
          name: windows-validation
          path: validation
      - name: Verify validated release inputs
        run: |
          cd bundle
          sha256sum --check SHA256SUMS.txt
          python3 - <<'PY'
          import json
          for file in ['../validation/windows-smoke.json', '../validation/windows-installer.json']:
              data=json.load(open(file))
              assert data['passed'] and data['platform']=='win32', file
          PY
      - name: Publish Windows beta
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: v${{ needs.windows.outputs.version }}-beta.${{ github.run_number }}
        run: |
          gh release create "$TAG" bundle/* validation/windows-smoke.json validation/windows-installer.json --target "$GITHUB_SHA" --title "WbSpace ${{ needs.windows.outputs.version }} · Windows x64 Beta" --notes-file docs/windows-release-notes.md --prerelease --draft
          gh release edit "$TAG" --draft=false
